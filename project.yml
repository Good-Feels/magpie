name: Magpie
options:
  bundleIdPrefix: com.goodfeels
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ClipboardEngine:
    path: ClipboardEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift.git
    from: "4.3.0"

targets:
  Magpie:
    type: application
    platform: macOS
    sources:
      - path: Magpie
        excludes:
          - Magpie.entitlements
      - path: MagpieKeeperCore
    dependencies:
      - target: MagpieKeeper
        embed: false
        link: false
      - package: ClipboardEngine
      - package: Sparkle
      - package: KeyboardShortcuts
      - package: Mixpanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goodfeels.magpie
        PRODUCT_NAME: Magpie
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: Magpie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Magpie/Magpie.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_TEAM: HTPHAYLD9X
        CODE_SIGN_STYLE: Automatic
      configs:
        debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          CODE_SIGN_IDENTITY: "Apple Development"
    postBuildScripts:
      - name: Embed MagpieKeeper
        script: |
          set -euo pipefail
          AGENT_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchAgents"
          SERVICE_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchServices"
          mkdir -p "$AGENT_DIR" "$SERVICE_DIR"
          cp -f "${BUILT_PRODUCTS_DIR}/MagpieKeeper" "$SERVICE_DIR/MagpieKeeper"
          cp -f "${SRCROOT}/Support/com.goodfeels.magpie.keeper.plist" \
              "$AGENT_DIR/com.goodfeels.magpie.keeper.plist"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/MagpieKeeper
          - $(SRCROOT)/Support/com.goodfeels.magpie.keeper.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchServices/MagpieKeeper
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.goodfeels.magpie.keeper.plist

  MagpieKeeper:
    type: tool
    platform: macOS
    sources:
      - path: MagpieKeeper
        excludes:
          - Info.plist
      - path: MagpieKeeperCore
    settings:
      base:
        PRODUCT_NAME: MagpieKeeper
        PRODUCT_BUNDLE_IDENTIFIER: com.goodfeels.magpie.keeper
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: MagpieKeeper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: Support/MagpieKeeper.entitlements
        MAGPIE_APPLICATION_BUNDLE_IDENTIFIER: com.goodfeels.magpie
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: HTPHAYLD9X
        CODE_SIGN_STYLE: Automatic
      configs:
        debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          CODE_SIGN_IDENTITY: "Apple Development"
